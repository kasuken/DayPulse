<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DayPulse</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="DayPulse.App.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" role="alert" aria-live="assertive">
        <span id="blazor-error-message">An unhandled error has occurred.</span>
        <a id="blazor-error-reload" href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss error message">×</button>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/daypulse-install-prompt-bootstrap.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
